name: 📦 Publish to PyPi
on:
  release:
    types: [created]
permissions:
  contents: read

jobs:
  tests:
    name: Linting and running tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Start databases
      working-directory:  ./sample-apps/databases
      run: docker compose up --build -d
    - name: Add local.aikido.io to /etc/hosts
      run: |
          sudo echo "127.0.0.1 local.aikido.io" | sudo tee -a /etc/hosts

    - name: Setup safe-chain
      run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

    - name: Installation
      run: make dev_install
    - name: Run Pylint
      run: |
        poetry run pylint --fail-under=9 --rcfile=.pylintrc aikido_zen/
        pylint_exit_code=$?
        if [ $pylint_exit_code -ne 0 ]; then
          echo "Pylint check failed. Please fix the issues."
          exit 1
        fi
    - name: Build and start aikido mock server
      run: |
        cd end2end/server && docker build -t mock_core .
        docker run --name mock_core -d -p 5050:5000 mock_core
    - name: Run Black Check
      run: |
        poetry run black --check --diff aikido_zen/
        black_exit_code=$?
        if [ $black_exit_code -ne 0 ]; then
          echo "Black check failed. Please run 'black .' to format the code."
          exit 1
        fi
    - name: Run tests
      run: |
        make test
  build:
    name: Build distribution 📦
    needs:
      - tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install poetry
      run: pip install poetry
    - name: Set the version for this release
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
      run: python set_release_version.py
    - name: Download binaries & build
      run: make build
    - name: Upload package distributions
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: python-distribution
        path: dist/
        if-no-files-found: error
  publish:
    name: Publish package distributions to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - name: Download package distributions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: python-distribution
        path: dist/
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
