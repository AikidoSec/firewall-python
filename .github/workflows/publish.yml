name: 📦 Publish to PyPi
on:
  release:
    types: [created]
permissions:
  id-token: write
  contents: read

jobs:
  tests:
    name: Linting and running tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Start databases
      working-directory:  ./sample-apps/databases
      run: docker compose up --build -d
    - name: Add local.aikido.io to /etc/hosts
      run: |
          sudo echo "127.0.0.1 local.aikido.io" | sudo tee -a /etc/hosts

    - name: Setup safe-chain
      env:
        SAFECHAIN_VERSION: "1.0.0"
        SAFECHAIN_SHA256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      run: |
        curl -fsSL -o install-safe-chain.sh "https://github.com/AikidoSec/safe-chain/releases/download/v${SAFECHAIN_VERSION}/install-safe-chain.sh"
        echo "${SAFECHAIN_SHA256}  install-safe-chain.sh" | sha256sum -c -
        sh install-safe-chain.sh --ci
        rm install-safe-chain.sh

    - name: Installation
      run: make dev_install
    - name: Run Pylint
      run: |
        poetry run pylint --fail-under=9 --rcfile=.pylintrc aikido_zen/
        pylint_exit_code=$?
        if [ $pylint_exit_code -ne 0 ]; then
          echo "Pylint check failed. Please fix the issues."
          exit 1
        fi
    - name: Build and start aikido mock server
      run: |
        cd end2end/server && docker build -t mock_core .
        docker run --name mock_core -d -p 5050:5000 mock_core
    - name: Run Black Check
      run: |
        poetry run black --check --diff aikido_zen/
        black_exit_code=$?
        if [ $black_exit_code -ne 0 ]; then
          echo "Black check failed. Please run 'black .' to format the code."
          exit 1
        fi
    - name: Run tests
      run: |
        make test
  build:
    name: Build distribution 📦 and Publish to PyPI
    needs:
      - tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install poetry
      run: pip install poetry
    - name: Set the version for this release
      run: |
        TAG_NAME=${GITHUB_REF##*/}
        make replace_version version=${TAG_NAME#v}
    - name: Download binaries & build
      run: make build
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@67339c736fd9354cd4f8cb0b744f2b82a74b5c70 # release/v1
