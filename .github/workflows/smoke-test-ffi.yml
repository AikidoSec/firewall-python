name: 🔥 Smoke Tests for FFI
on: [push]
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-14 is ARM-based
        # macos-14-large is x86-based
        # ubuntu-latest (x86) is not included because the full test suite runs on it
        os: [windows-latest, macos-14, macos-14-large, ubuntu-22.04-arm]

    # Allows all jobs to run even if one fails
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14

      - name: Display system info
        run: |
          python -c "import platform; print(f'Machine architecture: {platform.machine()}')"
          python -c "import platform; print(f'OS: {platform.system()}')"

      - name: Install MySQL
        if: runner.os == 'macOS'
        run: brew install mysql

      - name: Install MySQL
        if: runner.os == 'Linux'
        run: sudo apt-get install libmysqlclient-dev

      - name: Setup safe-chain (Unix)
        if: runner.os != 'Windows'
        env:
          SAFECHAIN_VERSION: "1.0.0"
          SAFECHAIN_SHA256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        run: |
          curl -fsSL -o install-safe-chain.sh "https://github.com/AikidoSec/safe-chain/releases/download/v${SAFECHAIN_VERSION}/install-safe-chain.sh"
          echo "${SAFECHAIN_SHA256}  install-safe-chain.sh" | sha256sum -c -
          sh install-safe-chain.sh --ci
          rm install-safe-chain.sh
      - name: Setup safe-chain (Windows)
        if: runner.os == 'Windows'
        env:
          SAFECHAIN_VERSION: "1.0.0"
          SAFECHAIN_SHA256: "E3B0C44298FC1C149AFBF4C8996FB92427AE41E4649B934CA495991B7852B855"
        run: |
          Invoke-WebRequest -Uri "https://github.com/AikidoSec/safe-chain/releases/download/v$env:SAFECHAIN_VERSION/install-safe-chain.ps1" -OutFile install-safe-chain.ps1
          $hash = (Get-FileHash -Path install-safe-chain.ps1 -Algorithm SHA256).Hash
          if ($hash -ne $env:SAFECHAIN_SHA256) { throw "Checksum verification failed" }
          & .\install-safe-chain.ps1 -ci
          Remove-Item install-safe-chain.ps1

      - name: Install dependencies
        run: make install && cp -r .cache/binaries/* aikido_zen/libs

      - name: Run tests
        run: poetry run pytest aikido_zen/vulnerabilities/sql_injection/init_test.py
