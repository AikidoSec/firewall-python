name: 🧪 Unit Tests
on: [pull_request, push]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      # Don't cancel jobs if one fails
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Start databases
      working-directory:  ./sample-apps/databases
      run: docker compose up --build -d
    - name: Add local.aikido.io to /etc/hosts
      run: |
          sudo echo "127.0.0.1 local.aikido.io" | sudo tee -a /etc/hosts
    - name: Build and start aikido mock server
      run: |
        cd end2end/server && docker build -t mock_core .
        docker run --name mock_core -d -p 5050:5000 mock_core

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup safe-chain
      run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        make install
    - name: Run tests with coverage
      run: |
        make cov

    - name: Upload coverage report to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        fail_ci_if_error: true
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
    
    - name: Upload coverage artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage
        path: coverage/
        if-no-files-found: error

  upload-coverage-to-aikido:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' 
    permissions:
      id-token: write
      contents: read
    steps:
          - name: Download coverage artifact
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with:
              name: coverage
              path: coverage

          - name: Upload coverage to Aikido
            uses: AikidoSec/code-coverage-github-action@c649d671735d625ec9d39bab5efae5921160ea63 # v0.1.0
            with:
              lcov-file-paths: coverage/lcov.info  