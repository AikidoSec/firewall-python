# Only odoo-init-enabled builds the image. Building it once per service makes the
# parallel builds fail on the shared tag.
x-odoo-image: &odoo-image
  image: firewall-python-odoo-sample:${ODOO_VERSION:-16.0}
  pull_policy: never

x-odoo-environment: &odoo-environment
  HOST: postgres
  PORT: 5432
  USER: odoo
  PASSWORD: odoo

services:
  mock:
    build: ../../end2end/server
    ports:
      - "127.0.0.1:5000:5000"

  postgres:
    image: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=odoo --dbname=postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  odoo-init-enabled:
    <<: *odoo-image
    build:
      context: ../..
      dockerfile: sample-apps/odoo-postgres/Dockerfile
      args:
        ODOO_IMAGE: odoo:${ODOO_VERSION:-16.0}
    command: ["/usr/local/bin/initialize-odoo-database"]
    environment:
      <<: *odoo-environment
      ODOO_DATABASE: odoo_zen
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - odoo-enabled-data:/var/lib/odoo

  odoo-init-disabled:
    <<: *odoo-image
    command: ["/usr/local/bin/initialize-odoo-database"]
    environment:
      <<: *odoo-environment
      ODOO_DATABASE: odoo_without_zen
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - odoo-disabled-data:/var/lib/odoo

  odoo:
    <<: *odoo-image
    command:
      - odoo
      - --config=/etc/odoo/odoo.conf
      - --database=odoo_zen
      - --db-filter=^odoo_zen$$
      - --load=base,web,aikido_zen_bootstrap
      - --workers=${ODOO_WORKERS:-0}
    environment:
      <<: *odoo-environment
      AIKIDO_BLOCK: "true"
      AIKIDO_DEBUG: "true"
      AIKIDO_TOKEN: AIK_secret_token
      AIKIDO_ENDPOINT: http://mock:5000/
      AIKIDO_REALTIME_ENDPOINT: http://mock:5000/
    depends_on:
      mock:
        condition: service_started
      odoo-init-enabled:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8069/zen/status >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 60
    ports:
      - "127.0.0.1:${ODOO_PORT:-8120}:8069"
    volumes:
      - odoo-enabled-data:/var/lib/odoo

  odoo-disabled:
    <<: *odoo-image
    command:
      - odoo
      - --config=/etc/odoo/odoo.conf
      - --database=odoo_without_zen
      - --db-filter=^odoo_without_zen$$
      - --load=base,web,aikido_zen_bootstrap
      - --workers=${ODOO_WORKERS:-0}
    environment:
      <<: *odoo-environment
      AIKIDO_DISABLE: "true"
    depends_on:
      odoo-init-disabled:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8069/zen/status >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 60
    ports:
      - "127.0.0.1:${ODOO_DISABLED_PORT:-8121}:8069"
    volumes:
      - odoo-disabled-data:/var/lib/odoo

volumes:
  postgres-data:
  odoo-enabled-data:
  odoo-disabled-data:
